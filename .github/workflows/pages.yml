name: Deploy quality insight to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout legacy source
        uses: actions/checkout@v4
        with:
          ref: 96f7b4239dfb7883323616fbc40a6003c9668a7e
          path: legacy
      - name: Checkout v2 source
        uses: actions/checkout@v4
        with:
          ref: 1f547f848e3a258814a6c4b5f0343ac1b0a4c088
          path: v2-source
      - name: Checkout accuracy v1.1 source
        uses: actions/checkout@v4
        with:
          ref: dfa268655ac0957907ae89af532213e0a1222bc4
          path: accuracy-source
      - name: Checkout accuracy v1.2 source
        uses: actions/checkout@v4
        with:
          ref: 6f70eab4e6e9ecadc00149b1387103b45b5d8e2b
          path: accuracy-v12-source
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build legacy site
        working-directory: legacy
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run build:pages
          # vite.pages.config.ts 已将产物规整为 pages-dist/index.html + ./assets/；
          # 保留对旧产物布局（pages-static/index.html + ../assets）的回退，兼容从旧配置构建的分支。
          if [ ! -f pages-dist/index.html ] && [ -f pages-dist/pages-static/index.html ]; then
            cp pages-dist/pages-static/index.html pages-dist/index.html
            sed -i 's|\.\./assets/|./assets/|g' pages-dist/index.html
            rm -rf pages-dist/pages-static
          fi
          node scripts/check-pages-build.mjs
      - name: Build v2 site
        working-directory: v2-source
        run: |
          npm ci
          npm run build:pages
          if [ ! -f pages-dist/index.html ] && [ -f pages-dist/pages-static/index.html ]; then
            cp pages-dist/pages-static/index.html pages-dist/index.html
            sed -i 's|\.\./assets/|./assets/|g' pages-dist/index.html
            rm -rf pages-dist/pages-static
          fi
          if [ -f scripts/check-pages-build.mjs ]; then node scripts/check-pages-build.mjs; else echo "v2 branch has no smoke check script, skipping"; fi
      - name: Build accuracy v1.1 site
        working-directory: accuracy-source
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run test:accuracy
          npm run build:pages
          node scripts/check-pages-build.mjs
      - name: Build accuracy v1.2 site
        working-directory: accuracy-v12-source
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run test:accuracy
          npm run test:workbook
          npm test
      - name: Compose versioned Pages artifact
        run: |
          mkdir -p pages-artifact/v2 pages-artifact/accuracy-v1.1 pages-artifact/accuracy-v1.2
          cp -a legacy/pages-dist/. pages-artifact/
          cp -a v2-source/pages-dist/. pages-artifact/v2/
          cp -a accuracy-source/pages-dist/. pages-artifact/accuracy-v1.1/
          cp -a accuracy-v12-source/pages-dist/. pages-artifact/accuracy-v1.2/
          touch pages-artifact/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
